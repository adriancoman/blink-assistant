display_information:
  name: Blink
  description: Merges branches and ships Expo app releases from Slack
features:
  bot_user:
    display_name: blink
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      # Progress reactions on your messages
      - reactions:write
      # Read thread follow-ups without another @mention
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
